<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🖤</title>
<meta name="description" content="A little letter, written by hand and sent the long way around." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Dancing+Script:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- soft cursor glow -->
<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

<!-- floating hearts, petals & sparkles live here -->
<div class="ambient" id="ambient" aria-hidden="true"></div>

<main>

  <!-- ══════════ SCENE 1 — THE ENVELOPE ══════════ -->
  <section class="scene scene--envelope is-active" id="sceneEnvelope">

    <div class="envelope" id="envelope" role="img" aria-label="A closed letter, sealed with a wax heart">
      <div class="envelope__paper" id="envelopePaper">
        <span class="envelope__paper-line"></span>
        <span class="envelope__paper-line"></span>
        <span class="envelope__paper-line short"></span>
        <span class="envelope__paper-heart">♥</span>
      </div>
      <div class="envelope__body"></div>
      <div class="envelope__flap"></div>
      <button class="seal heart-click" id="seal" type="button" aria-label="Wax seal — tap for hearts">
        <i class="fa-solid fa-heart seal__mark"></i>
      </button>
    </div>

    <button class="btn btn--primary" id="openBtn" type="button">Open Here</button>
    <p class="scene__hint">Sorry My Love</p>
  </section>

  <!-- ══════════ SCENE 2 — THE LETTER ══════════ -->
  <section class="scene scene--letter" id="sceneLetter" hidden>

    <article class="letter" id="letter">
      <header class="letter__head">
        <h1 class="letter__title">To My Sophia...</h1>
        <p class="letter__date" id="letterDate"></p>
      </header>

      <div class="letter__body" id="letterBody"></div>

      <button class="letter__skip" id="skipBtn" type="button">Skip the writing</button>
    </article>

    <section class="afterword" id="afterword" hidden>
      <div class="afterword__heart heart-click heartbeat" id="bigHeart" role="button" tabindex="0" aria-label="Tap the heart"><i class="fa-solid fa-heart"></i></div>
      <p class="afterword__line">You made it this far…</p>
      <button class="btn btn--ghost" id="oneMoreBtn" type="button">One More Thing…</button>

      <div class="final" id="final" hidden>
        <p class="final__text">I don't know where this story will go, but I'm really glad I met you. 🖤</p>
        <div class="final__bloom" aria-hidden="true">
          <span><i class="fa-solid fa-heart"></i></span><span><i class="fa-solid fa-heart"></i></span><span><i class="fa-solid fa-heart"></i></span><span><i class="fa-solid fa-heart"></i></span><span><i class="fa-solid fa-heart"></i></span>
        </div>
      </div>
    </section>
  </section>

</main>

<!-- ══════════ SECRET MESSAGE ══════════ -->
<button class="secret-btn" id="secretBtn" type="button"><i class="fa-solid fa-envelope-open-text"></i> Secret Message</button>

<div class="modal" id="secretModal" hidden>
  <div class="modal__backdrop" data-close></div>
  <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="secretText">
    <button class="modal__x" id="modalClose" type="button" aria-label="Close">×</button>
    <i class="fa-solid fa-heart modal__heart"></i>
    <p class="modal__text" id="secretText">'If you’re reading this… maybe by now, alam mo na kung ano talaga yung nararamdaman ko para sa’yo.' 🖤</p>
  </div>
</div>

<!-- ══════════ MUSIC PLAYER ══════════ -->
<div class="player" id="player">
  <div class="player__art">
    <img src="images/album-cover.jpg" alt="" id="albumArt" />
    <div class="player__art-fallback" aria-hidden="true"><i class="fa-solid fa-music"></i></div>
    <div class="viz" id="viz" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <div class="player__main">
    <div class="player__meta">
      <p class="player__title" id="trackTitle">A Little Something</p>
      <p class="player__artist" id="trackArtist">For You 🖤</p>
    </div>

    <div class="player__seek">
      <span class="player__time" id="timeNow">0:00</span>
      <input class="range range--seek" id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek" />
      <span class="player__time" id="timeTotal">0:00</span>
    </div>

    <div class="player__controls">
      <button class="icon-btn icon-btn--sm" id="uploadBtn" type="button" aria-label="Add your own song">
        <i class="fa-solid fa-plus"></i>
      </button>
      <button class="icon-btn" id="prevBtn" type="button" aria-label="Previous song">
        <i class="fa-solid fa-backward-step"></i>
      </button>
      <button class="icon-btn icon-btn--play" id="playBtn" type="button" aria-label="Play">
        <i class="fa-solid fa-play i-play"></i>
        <i class="fa-solid fa-pause i-pause"></i>
      </button>
      <button class="icon-btn" id="nextBtn" type="button" aria-label="Next song">
        <i class="fa-solid fa-forward-step"></i>
      </button>

      <div class="player__volume">
        <button class="icon-btn icon-btn--sm" id="muteBtn" type="button" aria-label="Mute">
          <i class="fa-solid fa-volume-high i-vol-on"></i>
          <i class="fa-solid fa-volume-xmark i-vol-off"></i>
        </button>
        <input class="range range--vol" id="volume" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume" />
      </div>
      <input type="file" id="fileInput" accept="audio/*" multiple hidden />
    </div>
  </div>

  <button class="player__toggle" id="playerToggle" type="button" aria-label="Hide player">
    <i class="fa-solid fa-chevron-left"></i>
  </button>
</div>

<audio id="audio" preload="metadata"></audio>

<script src="script.js"></script>
</body>
</html>
